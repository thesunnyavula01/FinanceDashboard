<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page paint under the notch and the home
      indicator; the safe-area insets in terminal.css are what keep the status
      rail and the command bar out from under them. Deliberately no
      maximum-scale and no user-scalable=no: this app is a wall of 12px
      numerals, and pinch-zoom is how somebody reads one.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FC Terminal" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="Paper trading terminal for the finance club stock simulation."
    />
    <title>Finance Club Terminal</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
